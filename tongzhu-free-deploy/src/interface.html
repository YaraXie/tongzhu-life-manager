@media(max-width:550px){.purchase-summary{align-items:flex-start;flex-direction:column;padding:18px}.purchase-summary h2{font-size:14px}.purchase-summary .btn{width:100%}.purchase-counts{gap:8px}.purchase-counts>span{padding:12px;font-size:10px;gap:4px}.purchase-counts strong{font-size:21px}.purchase-card{padding:17px}.purchase-steps{padding:11px 10px;gap:5px}.purchase-step{font-size:9px;gap:5px;align-items:flex-start}.purchase-step>span{width:18px;height:18px;font-size:9px}.purchase-step strong{line-height:1.7}.purchase-item h3{font-size:14px}.purchase-item p{font-size:10px}.purchase-complete-line{gap:9px}.purchase-card-actions{gap:12px}.purchase-card-actions .btn{flex:1}}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark" id="brand-icon"></div><div class="brand-copy"><div class="brand-name">同住</div><small>BETTER TOGETHER</small></div></div><div class="space-label">我们的合租生活</div><nav class="nav" id="nav" aria-label="主导航"></nav><div class="sidebar-bottom"><div class="house-card"><strong>梧桐小屋 · 302</strong><span><i class="status-dot"></i>3 位室友，共同经营</span></div><div class="profile"><span class="avatar" id="profile-avatar">沐</span><div><label for="member-select" class="small subtle">当前体验身份</label><select id="member-select" aria-label="切换体验室友"></select></div></div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><span id="room-crumb">梧桐小屋</span> <span style="margin:0 9px;color:#c3c9bd">/</span> <strong id="breadcrumb">生活概览</strong></div><div class="date-pill" id="today-label"></div></header><div class="collab-banner" id="collab-banner"></div><div id="content"></div><footer class="footer"><span>同住 · 把琐事理清，把日子过好</span><button data-action="reset">重置示例数据</button></footer><p class="demo-note" id="demo-note"></p></main></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" data-action="close" aria-label="关闭弹窗">×</button></div><div class="modal-body" id="modal-body"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
const ICONS={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',wallet:'<path d="M20 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h15V8H5a3 3 0 0 1 0-5"/><path d="M20 12h-5v5h5"/><path d="M17 14.5h.1"/>',clean:'<path d="m14 3-4 9m-4-2 9 4-4 8-9-4Z"/><path d="m6 15-2 4m5-3-2 4M18 4v5m-2-2h4m-1 7v4m-2-2h4"/>',box:'<path d="m3 7 9-4 9 4v11l-9 4-9-4Z"/><path d="m3 7 9 4 9-4M12 11v11m-5-17 10 4"/>',rules:'<rect x="5" y="4" width="15" height="18" rx="2"/><path d="M9 2v4m7-4v4M9 11h7m-7 5h7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h2m4 0h2"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5Zm5 3h4"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m3 3a5 5 0 0 1 2 4v2"/>',leaf:'<path d="M20 3C7 2 2 8 6 16c8 4 14-1 14-13Z"/><path d="m4 21 11-12"/>'};
const icon=n=>'<svg aria-hidden="true" viewBox="0 0 24 24">'+(ICONS[n]||ICONS.home)+'</svg>';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let MEMBERS=[{id:'m1',name:'小沐',short:'沐',room:'主卧'},{id:'m2',name:'阿哲',short:'哲',room:'次卧 A'},{id:'m3',name:'可可',short:'可',room:'次卧 B'}];
const member=id=>MEMBERS.find(x=>x.id===id)||MEMBERS[0];
const avatar=id=>{const m=member(id);return '<span class="avatar av-'+MEMBERS.indexOf(m)+'">'+esc(m.short)+'</span>'};
const localDate=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const dayAdd=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return localDate(d)};
const monday=()=>{const d=new Date(localDate()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return localDate(d)};
const TODAY=localDate(),MONDAY=monday(),KEY='tongzhu.baseline.v1';
const money=cents=>(cents/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const shortDate=s=>s.slice(5).replace('-','/');
const id=()=>crypto.randomUUID();
function parseCents(v){if(!/^\d+(\.\d{1,2})?$/.test(String(v)))return null;const [a,b='']=String(v).split('.');const c=Number(a)*100+Number(b.padEnd(2,'0'));return Number.isSafeInteger(c)&&c>0&&c<=100000000?c:null}
function shares(b){const n=b.participants.length,base=Math.floor(b.amount/n),rest=b.amount%n;return b.participants.map((mid,i)=>({member:mid,amount:base+(i<rest?1:0)}))}
function outstanding(b){return shares(b).filter(s=>s.member!==b.payer&&!b.settled.includes(s.member))}
function balance(mid){let pay=0,receive=0;state.bills.forEach(b=>outstanding(b).forEach(s=>{if(s.member===mid)pay+=s.amount;if(b.payer===mid)receive+=s.amount}));return {pay,receive}}
function seed(){return {version:1,current:'m1',anchor:MONDAY,bills:[{id:'b1',title:'10 月房租',category:'房租',amount:600000,payer:'m1',participants:['m1','m2','m3'],settled:['m2','m3'],date:TODAY.slice(0,8)+'01'},{id:'b2',title:'本月水电费',category:'水电',amount:28650,payer:'m2',participants:['m1','m2','m3'],settled:['m3'],date:dayAdd(TODAY,-2)},{id:'b3',title:'补充日用清洁用品',category:'日用',amount:8950,payer:'m1',participants:['m1','m2','m3'],settled:[],date:dayAdd(TODAY,-1)}],tasks:[{id:'t1',name:'厨房台面与灶台',day:1,base:0},{id:'t2',name:'客厅地面与垃圾分类',day:3,base:1},{id:'t3',name:'卫生间清洁',day:6,base:2}],done:{},items:[{id:'i1',name:'厨房纸巾',emoji:'🧻',quantity:1,threshold:2,unit:'卷',keeper:'m1',reminder:dayAdd(TODAY,7)},{id:'i2',name:'洗衣液',emoji:'🧴',quantity:2,threshold:1,unit:'瓶',keeper:'m2',reminder:dayAdd(TODAY,20)},{id:'i3',name:'垃圾袋',emoji:'🛍️',quantity:4,threshold:1,unit:'卷',keeper:'m3',reminder:dayAdd(TODAY,12)}],rules:[{id:'r1',title:'让账单清清楚楚',content:'公共费用记账时附上用途，默认按参与人均摊。室友在账单发布后 3 天内核对并完成结算。房租按本屋约定均摊。',approvals:['m1','m2','m3']},{id:'r2',title:'给彼此一段安静的时间',content:'23:00 至次日 8:00 为安静时段。使用耳机，减少公共区域的外放声音；有朋友来访请提前在群里打个招呼。',approvals:['m1','m2','m3']},{id:'r3',title:'公共空间，用完复原',content:'厨房使用后及时清洁台面，餐具当日洗净。按排班完成清洁，临时有事提前与室友协商调换。',approvals:['m2','m3']} ]}}
let state,storageOK=true;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');state=saved&&saved.version===1&&Array.isArray(saved.bills)&&Array.isArray(saved.items)&&Array.isArray(saved.tasks)&&Array.isArray(saved.rules)?saved:seed();if(!MEMBERS.some(m=>m.id===state.current))state.current='m1'}catch{state=seed()}
let page='overview',billFilter='all',weekOffset=0,toastTimer;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false;toast('当前浏览器无法保存，刷新后改动可能丢失')}render()}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3000)}
function weekStart(){return dayAdd(MONDAY,weekOffset*7)}
function owner(t){const weeks=Math.round((Date.parse(weekStart()+'T12:00:00')-Date.parse(state.anchor+'T12:00:00'))/604800000);return MEMBERS[((t.base+weeks)%MEMBERS.length+MEMBERS.length)%MEMBERS.length]}
function taskDate(t){return dayAdd(weekStart(),t.day-1)}
function taskKey(t){return t.id+':'+taskDate(t)}
function taskDone(t){return !!state.done[taskKey(t)]}
const itemAlert=i=>i.quantity<=i.threshold||(i.reminder&&i.reminder<=TODAY);
const sortedTasks=()=>[...state.tasks].sort((a,b)=>a.day-b.day);
const NAV=[['overview','grid','生活概览'],['bills','wallet','费用账本'],['chores','clean','清洁排班'],['items','box','共用物品'],['rules','rules','室友公约']];
const btn=(label,action,cls='btn',extra='')=>'<button type="button" class="'+cls+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
function stat(label,value,caption,ico,color=''){return '<article class="stat"><div class="stat-top">'+label+'<span class="stat-icon">'+icon(ico)+'</span></div><div class="stat-value '+color+'">'+value+'</div><div class="stat-caption">'+caption+'</div></article>'}
function title(h,p,button){return '<div class="section-title"><div><h1>'+h+'</h1><p>'+p+'</p></div>'+button+'</div>'}
function billRows(bills){return bills.length?'<div class="table-wrap"><table><thead><tr><th>费用明细</th><th>金额</th><th class="hide-mobile">垫付人</th><th>状态</th><th></th></tr></thead><tbody>'+bills.map(b=>'<tr><td><div class="bill-label"><span class="bill-emoji">'+({房租:'🏠',水电:'💧',日用:'🧺',其他:'🧾'}[b.category]||'🧾')+'</span><div><strong>'+esc(b.title)+'</strong><div class="small subtle">'+shortDate(b.date)+' · '+b.participants.length+' 人分摊</div></div></div></td><td><strong>¥'+money(b.amount)+'</strong></td><td class="hide-mobile">'+esc(member(b.payer).name)+'</td><td><span class="badge '+(outstanding(b).length?'warn':'')+'">'+(outstanding(b).length?'待结算':'已结清')+'</span></td><td>'+btn('查看','bill-detail','link-btn','data-id="'+b.id+'"')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">'+icon('wallet')+'这里还没有账单，记下第一笔共同支出吧。</div>'}
function overview(){const bal=balance(state.current),sum=state.bills.filter(b=>b.date.slice(0,7)===TODAY.slice(0,7)).reduce((s,b)=>s+b.amount,0);const previous=weekOffset;weekOffset=0;const pending=sortedTasks().filter(t=>!taskDone(t)),alerts=state.items.filter(itemAlert),unsigned=state.rules.filter(r=>!r.approvals.includes(state.current));let todos=[];
 if(bal.pay)todos.push(['wallet','本月账单，记得核对一下','你还有 ¥'+money(bal.pay)+' 待支付','待结算','bills','']);
 if(pending.length){const t=pending.find(t=>owner(t).id===state.current)||pending[0];todos.push(['clean',t.name,shortDate(taskDate(t))+' · '+esc(owner(t).name)+'负责','待完成','chores','green'])}
 if(alerts.length)todos.push(['box',alerts[0].name+'需要关注',alerts[0].quantity<=alerts[0].threshold?'仅剩 '+alerts[0].quantity+' '+esc(alerts[0].unit)+'，达到补货线':'已到预设提醒日期','需补货','items','blue']);
 if(unsigned.length)todos.push(['rules','有 '+unsigned.length+' 条公约等你确认','看过并同意后，点击「我已确认」','待确认','rules','green']);
 const taskCount=pending.length;weekOffset=previous;
 return '<section class="hero"><div><div class="eyebrow">A LITTLE CARE, A BETTER HOME</div><h1>小事有安排，<br class="hide-mobile">合租更自在。</h1><p>你好，'+esc(member(state.current).name)+'。今天也一起照顾好这个家。</p></div><div class="hero-art" aria-hidden="true"><div class="art-roof"></div><div class="art-house"><div class="art-door"></div><div class="art-window"></div><div class="art-window right"></div></div><div class="art-plant"></div></div></section><div class="stats">'+stat('本月公共支出','<small>¥</small>'+money(sum),'已记 '+state.bills.filter(b=>b.date.slice(0,7)===TODAY.slice(0,7)).length+' 笔 · 按参与人分摊','wallet')+stat('我待支付','<small>¥</small>'+money(bal.pay),'另有 ¥'+money(bal.receive)+' 待收款','users',bal.pay?'orange':'')+stat('本周待清洁',taskCount+'<small style="margin-left:5px">项</small>','每周轮换，共同分担','clean')+stat('物品提醒',alerts.length+'<small style="margin-left:5px">项</small>','低库存或到期时提醒','box')+'</div><div class="grid-main"><div><section class="panel"><div class="panel-head"><h2>'+icon('bell')+'小屋待办</h2><span class="badge neutral">'+todos.length+' 条提醒</span></div><div class="panel-body" style="padding-top:0;padding-bottom:0">'+(todos.length?todos.map(t=>'<div class="todo"><span class="todo-icon '+t[5]+'">'+icon(t[0])+'</span><div class="grow"><div class="todo-title">'+esc(t[1])+'</div><div class="todo-sub">'+t[2]+'</div></div>'+btn(t[3]+' ›','navigate','link-btn','data-page="'+t[4]+'"')+'</div>').join(''):'<div class="empty">今天没有待办，享受一下清爽的小屋吧。</div>')+'</div></section><section class="panel"><div class="panel-head"><h2>'+icon('wallet')+'最近的共同支出</h2>'+btn('全部账单 ↗','navigate','link-btn','data-page="bills"')+'</div>'+billRows([...state.bills].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3))+'</section></div><div class="side-panels"><section class="panel"><div class="panel-head"><h2>一起生活的我们</h2><span class="small subtle">'+esc(state.roomName||'302 室')+'</span></div><div class="panel-body">'+MEMBERS.map(m=>'<div class="roomie-row">'+avatar(m.id)+'<div><div class="roomie-name">'+esc(m.name)+'</div><div class="small subtle">'+esc(m.room)+'</div></div>'+(m.id===state.current?'<span class="badge">当前身份</span>':'')+'</div>').join('')+'<div class="quote">「 住在同一个屋檐下，<br>也给彼此刚刚好的空间。 」</div></div></section><section class="panel"><div class="panel-head"><h2>顺手记一笔</h2>'+icon('leaf')+'</div><div class="panel-body"><div class="quick-actions">'+[['wallet','新增账单','add-bill'],['clean','添加值日','add-task'],['box','登记物品','add-item'],['rules','发起公约','add-rule']].map(a=>btn(icon(a[0])+a[1],a[2],'quick')).join('')+'</div></div></section></div></div>'}
function billsPage(){const b=balance(state.current),bills=[...state.bills].sort((a,b)=>b.date.localeCompare(a.date)).filter(b=>billFilter==='all'||(billFilter==='pending'?outstanding(b).length:!outstanding(b).length));return title('费用账本','谁垫付、谁参与、还差多少，每一笔都清楚。',btn(icon('plus')+'记一笔','add-bill'))+'<div class="summary-strip"><div>我的待支付 <strong>¥'+money(b.pay)+'</strong></div><div>我的待收款 <strong>¥'+money(b.receive)+'</strong></div></div><div class="toolbar"><div class="tabs">'+[['all','全部账单'],['pending','待结算'],['settled','已结清']].map(([v,l])=>btn(l,'bill-filter',billFilter===v?'selected':'','data-value="'+v+'"')).join('')+'</div><span class="small subtle">按参与人均摊 · 余分依参与顺序分配</span></div><section class="panel">'+billRows(bills)+'</section><div class="notice">结算状态由室友手动确认，不涉及真实转账。查看账单可逐人核对分摊金额。</div>'}
function choresPage(){const tasks=sortedTasks(),done=tasks.filter(taskDone).length;return title('清洁排班','同样的家务，轮流分担。每周自动顺延一位室友。',btn(icon('plus')+'添加值日','add-task'))+'<div class="toolbar"><div class="tabs">'+btn('本周','week',weekOffset===0?'selected':'','data-value="0"')+btn('下周预览','week',weekOffset===1?'selected':'','data-value="1"')+'</div><span class="small subtle">'+weekStart()+' — '+dayAdd(weekStart(),6)+'</span></div><div class="summary-strip"><span>'+ (weekOffset?'看看下周谁来照顾小屋':'本周已完成 '+done+' / '+tasks.length+' 项')+'</span><strong>'+ (done===tasks.length&&tasks.length?'小屋很清爽 ✨':'分工明确，互相体谅')+'</strong></div><section class="panel">'+(tasks.length?tasks.map(t=>{const m=owner(t),isDone=taskDone(t);return '<div class="task-card '+(isDone?'completed':'')+'">'+btn(isDone?icon('check'):'','toggle-task','check '+(isDone?'done':''),'data-id="'+t.id+'" aria-label="'+(isDone?'撤销完成':'标记完成')+esc(t.name)+'" aria-pressed="'+isDone+'" '+(weekOffset?'disabled':''))+'<div class="task-day">周'+['一','二','三','四','五','六','日'][t.day-1]+'<div>'+shortDate(taskDate(t))+'</div></div><div class="grow"><div class="task-name">'+esc(t.name)+'</div><div class="small subtle">'+(isDone?'已完成':!weekOffset&&taskDate(t)<TODAY?'已过计划日，请记得补做':'每周一次 · 自动轮换')+'</div></div><div class="row-actions">'+avatar(m.id)+'<span class="small">'+esc(m.name)+'</span>'+btn('删除','delete-task','danger-link','data-id="'+t.id+'"')+'</div></div>'}).join(''):'<div class="empty">'+icon('clean')+'还没有排班，先添加一项公共区域清洁吧。</div>')+'</section>'+(weekOffset?'<p class="small subtle">下周为排班预览，完成状态在当周记录。</p>':'')}
function itemsPage(){return title('共用物品','用一点记一点，快用完时再也不用互相猜。',btn(icon('plus')+'登记物品','add-item'))+'<div class="notice">'+icon('bell')+' 库存达到提醒线，或到达预设日期，会出现在小屋待办。提醒在页面内显示。</div><div class="cards">'+state.items.map(i=>'<article class="item-card"><div class="item-top"><div class="item-emoji">'+esc(i.emoji)+'</div><span class="badge '+(itemAlert(i)?'warn':'')+'">'+(i.quantity<=i.threshold?'需要补货':i.reminder&&i.reminder<=TODAY?'到期提醒':'库存充足')+'</span></div><h3>'+esc(i.name)+'</h3><p>'+esc(member(i.keeper).name)+' 关注 · 提醒线 ≤ '+i.threshold+' '+esc(i.unit)+'</p><div class="stock"><strong>'+i.quantity+'<span>'+esc(i.unit)+'</span></strong><div class="stock-adjust">'+btn('−','consume','icon-button','data-id="'+i.id+'" aria-label="消耗一'+esc(i.unit)+esc(i.name)+'" '+(i.quantity===0?'disabled':''))+btn('补货 +','restock','btn secondary tiny','data-id="'+i.id+'"')+'</div></div><div class="progress"><i style="width:'+Math.min(100,i.quantity/Math.max(i.threshold*3,1)*100)+'%;background:'+(itemAlert(i)?'#c2a378':'#9cb18c')+'"></i></div><div class="item-footer"><span>'+(i.reminder?'下次提醒 '+i.reminder:'未设日期提醒')+'</span>'+btn('删除','delete-item','danger-link','data-id="'+i.id+'"')+'</div></article>').join('')+'</div>'+(!state.items.length?'<div class="empty">'+icon('box')+'登记纸巾、洗衣液等共同使用的物品吧。</div>':'')}
function rulesPage(){const all=state.rules.filter(r=>r.approvals.length===MEMBERS.length).length;return title('室友公约','提前说清楚，比发生矛盾后再解释更轻松。',btn(icon('plus')+'发起公约','add-rule'))+'<div class="summary-strip"><span>'+icon('users')+' 一起讨论，一起确认</span><strong>'+all+' / '+state.rules.length+' 条全员确认</strong></div>'+state.rules.map((r,index)=>'<article class="rule-card"><div class="rule-top"><span class="rule-number">HOUSE AGREEMENT / '+String(index+1).padStart(2,'0')+'</span><span class="badge '+(r.approvals.length===MEMBERS.length?'':'warn')+'">'+(r.approvals.length===MEMBERS.length?'全员已确认':'等待确认')+'</span></div><h3>'+esc(r.title)+'</h3><p>'+esc(r.content)+'</p><div class="rule-footer"><div class="avatars">'+r.approvals.map(avatar).join('')+'<small>'+r.approvals.length+' / '+MEMBERS.length+' 人确认</small></div><div class="row-actions">'+btn('删除','delete-rule','danger-link','data-id="'+r.id+'"')+btn(r.approvals.includes(state.current)?icon('check')+'我已确认':'我已阅读并确认','confirm-rule','btn '+(r.approvals.includes(state.current)?'ghost':'secondary')+' tiny','data-id="'+r.id+'" '+(r.approvals.includes(state.current)?'disabled':''))+'</div></div></article>').join('')+(!state.rules.length?'<div class="empty">'+icon('rules')+'从安静时间、访客和公共空间的规则开始吧。</div>':'')}
function render(){document.getElementById('nav').innerHTML=NAV.map(([p,i,n])=>'<button data-action="navigate" data-page="'+p+'" class="'+(page===p?'active':'')+'" '+(page===p?'aria-current="page"':'')+'>'+icon(i)+'<span>'+n+'</span></button>').join('');document.getElementById('brand-icon').innerHTML=icon('home');document.getElementById('breadcrumb').textContent=NAV.find(x=>x[0]===page)[2];document.getElementById('today-label').innerHTML=icon('calendar')+new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});document.getElementById('member-select').innerHTML=MEMBERS.map(m=>'<option value="'+m.id+'" '+(m.id===state.current?'selected':'')+'>'+esc(m.name)+'</option>').join('');document.getElementById('profile-avatar').outerHTML=avatar(state.current).replace('class="','id="profile-avatar" class="');document.getElementById('content').innerHTML='<div class="page">'+({overview,bills:billsPage,chores:choresPage,items:itemsPage,rules:rulesPage}[page])()+'</div>';document.getElementById('demo-note').innerHTML=icon('info')+(storageOK?'体验版 · 含示例数据，仅保存在当前浏览器；尚未接入多人同步。':'当前浏览器无法保存数据，刷新后改动可能丢失。')+' <button class="link-btn" data-action="switch-member">切换室友身份</button>';if(window.sharedDecorate)window.sharedDecorate()}
const modal=document.getElementById('modal');
function openModal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;if(!modal.open)modal.showModal()}
const opts=(selected=state.current)=>MEMBERS.map(m=>'<option value="'+m.id+'" '+(m.id===selected?'selected':'')+'>'+esc(m.name)+'</option>').join('');
const inputField=(label,name,type='text',value='',extra='')=>'<label class="field"><span>'+label+'</span><input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>';
const selectField=(label,name,options)=>'<label class="field"><span>'+label+'</span><select name="'+name+'">'+options+'</select></label>';
const form=(kind,body,submit='保存')=>'<form data-kind="'+kind+'">'+body+'<div class="form-error" role="alert"></div><div class="modal-actions">'+btn('取消','close','btn ghost')+'<button class="btn" type="submit">'+submit+'</button></div></form>';
function addBill(){openModal('记一笔共同支出',form('bill',inputField('费用名称','title','text','','required maxlength="40" placeholder="例如：本月水电费"')+'<div class="field-row">'+inputField('总金额（元）','amount','number','','required min="0.01" max="1000000" step="0.01" placeholder="0.00"')+selectField('费用类型','category',['房租','水电','日用','其他'].map(x=>'<option>'+x+'</option>').join(''))+'</div><div class="field-row">'+selectField('谁先垫付','payer',opts())+inputField('费用日期','date','date',TODAY,'required')+'</div><fieldset class="field"><legend>参与分摊的室友</legend><div class="checks">'+MEMBERS.map(m=>'<label><input type="checkbox" name="participants" value="'+m.id+'" checked>'+esc(m.name)+'</label>').join('')+'</div><small>默认均摊，可取消未参与的室友。余分依上方参与顺序分配，保证合计准确。</small></fieldset>','保存账单'))}
function billDetail(bid){const b=state.bills.find(x=>x.id===bid);if(!b)return;openModal('账单分摊详情','<p style="margin-top:0"><strong>'+esc(b.title)+'</strong><br><span class="small subtle">'+b.date+' · '+esc(member(b.payer).name)+'垫付</span></p><div class="summary-strip"><span>共同支出</span><strong>¥'+money(b.amount)+'</strong></div>'+shares(b).map(s=>'<div class="share-row">'+avatar(s.member)+'<div class="grow"><div>'+esc(member(s.member).name)+'</div><div class="small subtle">'+(s.member===b.payer?'已自行垫付':b.settled.includes(s.member)?'已确认支付给'+member(b.payer).name:'待支付给'+member(b.payer).name)+'</div></div><strong>¥'+money(s.amount)+'</strong>'+(s.member===b.payer?'<span class="badge neutral">本人份额</span>':btn(b.settled.includes(s.member)?'撤销结算':'确认已结算','settle','btn '+(b.settled.includes(s.member)?'ghost':'secondary')+' tiny','data-id="'+b.id+'" data-member="'+s.member+'"'))+'</div>').join('')+'<p class="small subtle">体验版可代室友确认状态；此操作仅记账，不会发起转账。</p><div class="modal-actions">'+btn('删除账单','delete-bill','btn danger','data-id="'+b.id+'"')+btn('完成','close','btn')+'</div>')}
function addTask(){openModal('添加每周值日',form('task',inputField('清洁任务','name','text','','required maxlength="40" placeholder="例如：阳台清洁"')+'<div class="field-row">'+selectField('每周哪一天','day',['一','二','三','四','五','六','日'].map((d,i)=>'<option value="'+(i+1)+'">周'+d+'</option>').join(''))+selectField('本周从谁开始','owner',opts())+'</div><p class="small subtle">按当前房间成员顺序每周轮换。新任务从本周开始排班。</p>'))}
function addItem(){openModal('登记共用物品',form('item',inputField('物品名称','name','text','','required maxlength="30" placeholder="例如：洗手液"')+'<div class="field-row">'+inputField('当前库存','quantity','number','1','required min="0" max="9999" step="1"')+inputField('单位','unit','text','瓶','required maxlength="8"')+'</div><div class="field-row">'+inputField('补货提醒线（≤）','threshold','number','1','required min="0" max="9999" step="1"')+selectField('由谁关注','keeper',opts())+'</div>'+inputField('下次日期提醒（选填）','reminder','date',dayAdd(TODAY,30)),'登记物品'))}
function restock(iid){const i=state.items.find(x=>x.id===iid);if(!i)return;openModal('补货 · '+i.name,form('restock','<input type="hidden" name="id" value="'+i.id+'">'+inputField('本次补充数量（'+esc(i.unit)+'）','quantity','number','1','required min="1" max="9999" step="1"')+inputField('下次提醒日期（选填）','reminder','date',dayAdd(TODAY,30)),'确认补货'))}
function addRule(){openModal('发起一条室友公约',form('rule',inputField('公约标题','title','text','','required maxlength="40" placeholder="例如：朋友来访提前沟通"')+'<label class="field"><span>具体约定</span><textarea name="content" required maxlength="800" placeholder="把具体时间、行为和例外情况说清楚。"></textarea></label><p class="small subtle">发起后由每位室友分别阅读确认；发起人也需要确认。</p>','发起公约'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,bid=b.dataset.id;
 if(a==='navigate'){page=b.dataset.page;weekOffset=0;render();window.scrollTo({top:0,behavior:'smooth'})}
 else if(a==='close')modal.close();else if(a==='add-bill')addBill();else if(a==='add-task')addTask();else if(a==='add-item')addItem();else if(a==='add-rule')addRule();
 else if(a==='bill-detail')billDetail(bid);
 else if(a==='bill-filter'){billFilter=b.dataset.value;render()}
 else if(a==='week'){weekOffset=Number(b.dataset.value);render()}
 else if(a==='toggle-task'){const t=state.tasks.find(t=>t.id===bid);if(!t||weekOffset)return;state.done[taskKey(t)]=!taskDone(t);persist();toast(state.done[taskKey(t)]?'值日已完成，辛苦啦！':'已撤销完成')}
 else if(a==='settle'){const bill=state.bills.find(x=>x.id===bid),mid=b.dataset.member;if(!bill||mid===bill.payer)return;bill.settled=bill.settled.includes(mid)?bill.settled.filter(x=>x!==mid):[...bill.settled,mid];persist();billDetail(bid);toast('结算状态已更新')}
 else if(a==='consume'){const i=state.items.find(x=>x.id===bid);if(!i||i.quantity<1)return;i.quantity--;persist();toast('已记录消耗 1 '+i.unit)}
 else if(a==='restock')restock(bid);
 else if(a==='confirm-rule'){const r=state.rules.find(x=>x.id===bid);if(r&&!r.approvals.includes(state.current)){r.approvals.push(state.current);persist();toast('已记录你的确认')}}
 else if(a.startsWith('delete-')){const mapping={'delete-bill':['bills','账单'],'delete-task':['tasks','每周排班'],'delete-item':['items','物品'],'delete-rule':['rules','公约']};const [key,label]=mapping[a]||[];if(key&&confirm('确定删除这条'+label+'吗？')){state[key]=state[key].filter(x=>x.id!==bid);if(modal.open)modal.close();persist();toast('已删除')}}
 else if(a==='reset'){if(confirm('重置会删除当前浏览器中的体验记录并恢复示例，是否继续？')){state=seed();weekOffset=0;billFilter='all';persist();toast('已恢复示例数据')}}
 else if(a==='switch-member'){openModal('切换体验身份','<p class="small subtle">用不同室友的视角查看账单、确认公约。此处仅用于单机演示。</p>'+MEMBERS.map(m=>'<div class="share-row">'+avatar(m.id)+'<span class="grow">'+esc(m.name)+'</span>'+btn(m.id===state.current?'当前身份':'切换到此室友','select-member','btn secondary tiny','data-member="'+m.id+'" '+(m.id===state.current?'disabled':''))+'</div>').join(''))}
 else if(a==='select-member'){state.current=b.dataset.member;modal.close();persist();toast('已切换为'+member(state.current).name)}
});
document.getElementById('member-select').addEventListener('change',e=>{state.current=e.target.value;persist();toast('已切换为'+member(state.current).name)});
document.addEventListener('submit',e=>{const f=e.target;if(!f.matches('form[data-kind]'))return;e.preventDefault();const d=new FormData(f),v=k=>String(d.get(k)||'').trim(),kind=f.dataset.kind;const fail=s=>{f.querySelector('.form-error').textContent=s};
 if(kind==='bill'){const amount=parseCents(v('amount')),participants=d.getAll('participants');if(!v('title'))return fail('请输入费用名称');if(amount===null)return fail('金额需大于 0，最多两位小数，且不超过 100 万元');if(!participants.length)return fail('请至少选择一位分摊人');if(!v('date'))return fail('请选择费用日期');state.bills.unshift({id:id(),title:v('title'),amount,participants,payer:v('payer'),category:v('category'),date:v('date'),settled:[]});page='bills';billFilter='all'}
 else if(kind==='task'){if(!v('name'))return fail('请输入清洁任务');const base=MEMBERS.findIndex(m=>m.id===v('owner'));state.tasks.push({id:id(),name:v('name'),day:Number(v('day')),base});page='chores';weekOffset=0;const weeks=Math.round((Date.parse(MONDAY+'T12:00:00')-Date.parse(state.anchor+'T12:00:00'))/604800000);state.tasks[state.tasks.length-1].base=((base-weeks)%MEMBERS.length+MEMBERS.length)%MEMBERS.length}
 else if(kind==='item'){if(!v('name')||!v('unit'))return fail('请填写物品名称和单位');const quantity=Number(v('quantity')),threshold=Number(v('threshold'));if(!Number.isInteger(quantity)||quantity<0||quantity>9999||!Number.isInteger(threshold)||threshold<0||threshold>9999)return fail('库存和提醒线需为 0–9999 的整数');state.items.push({id:id(),name:v('name'),unit:v('unit'),quantity,threshold,keeper:v('keeper'),reminder:v('reminder'),emoji:'📦'});page='items'}
 else if(kind==='restock'){const i=state.items.find(x=>x.id===v('id')),q=Number(v('quantity'));if(!i)return fail('物品已不存在');if(!Number.isInteger(q)||q<1||q+i.quantity>9999)return fail('请填写有效补货数量，库存总量不超过 9999');i.quantity+=q;i.reminder=v('reminder')}
 else if(kind==='rule'){if(!v('title')||!v('content'))return fail('请填写标题和具体约定');state.rules.push({id:id(),title:v('title'),content:v('content'),approvals:[]});page='rules'}
 else return;modal.close();persist();toast(kind==='restock'?'补货完成，小屋补给已更新':'已保存')});
window.Roommate={parseCents,shares,outstanding,balance,seed,owner,taskDate,render,getState:()=>state};
render();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false;render()}
</script>
<script src="/shared.js?v=5" defer></script>
<script src="/purchases.js?v=5" defer></script>
<script src="/quick-entry.js?v=5" defer></script>
